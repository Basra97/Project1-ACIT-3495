<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video Streaming</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Video Streaming</h1>
      <div class="spacer"></div>
      <div id="auth-section">
        <button id="login-btn" class="btn">Login</button>
        <div id="user-info" class="hidden">
          <span id="username-label"></span>
          <button id="logout-btn" class="btn outline">Logout</button>
        </div>
      </div>
  <a id="upload-link" href="./upload.html" class="btn outline" style="margin-left:8px; text-decoration:none; display:inline-flex; align-items:center">Upload</a>
      <button id="settings-btn" class="btn outline" style="margin-left:8px">Settings</button>
    </header>

    <main class="container">
      <section class="controls">
        <input id="search" type="search" placeholder="Search videos..." />
      </section>

      <section id="video-list" class="grid" aria-live="polite"></section>
    </main>

    <!-- Player modal -->
    <div id="player-modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <button id="close-player" class="icon-btn" aria-label="Close">✕</button>
        <h2 id="player-title"></h2>
        <video id="player" class="player" controls preload="metadata" poster="">
          <source id="player-source" src="" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </div>
    </div>

    <!-- Login modal -->
    <div id="login-modal" class="modal hidden" role="dialog" aria-modal="true">
      <form id="login-form" class="modal-content card" autocomplete="on">
        <h2>Login</h2>
        <label>
          Username
          <input id="username" name="username" required />
        </label>
        <label>
          Password
          <input id="password" name="password" type="password" required />
        </label>
        <div class="actions">
          <button type="submit" class="btn">Login</button>
          <button type="button" id="cancel-login" class="btn outline">Cancel</button>
        </div>
  <p class="hint">Validated via Authentication Service.</p>
      </form>
    </div>

    <!-- Settings modal -->
    <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true">
      <form id="settings-form" class="modal-content card" autocomplete="on">
        <h2>Settings</h2>
        <label>
          Auth Base URL
          <input id="cfg-auth" type="text" placeholder="http://localhost:4000" />
        </label>
        <label>
          API Base URL
          <input id="cfg-api" type="text" placeholder="http://localhost:5000" />
        </label>
        <label>
          File Base URL
          <input id="cfg-file" type="text" placeholder="http://localhost:6000" />
        </label>
        
        <div class="actions">
          <button type="button" id="settings-cancel" class="btn outline">Cancel</button>
          <button type="submit" class="btn">Save</button>
        </div>
      </form>
    </div>

    <!-- Toasts -->
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="./app.js" type="module"></script>
  </body>
  </html>
