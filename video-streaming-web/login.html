<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Sign in</h1>
      <div class="spacer"></div>
      <a class="btn outline" href="./signup.html" style="text-decoration:none; margin-left:8px">Create account</a>
      <a class="btn outline" href="./index.html" style="text-decoration:none; margin-left:8px">Back</a>
      <button id="settings-btn" class="btn outline" style="margin-left:8px">Settings</button>
    </header>
    <main class="container">
      <section class="card" style="padding:16px; display:grid; gap:12px;">
        <h2>Sign in</h2>
        <form id="signin-form" style="display:grid; gap:8px;">
          <label>Username <input id="si-username" required /></label>
          <label>Password <input id="si-password" type="password" required /></label>
          <div class="actions" style="display:flex; gap:8px; justify-content:flex-end;">
            <button class="btn" type="submit">Sign in</button>
          </div>
          <p class="hint small">Default admin: admin / admin123</p>
        </form>
      </section>
    </main>
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
    <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true">
      <form id="settings-form" class="modal-content card" autocomplete="on">
        <h2>Settings</h2>
        <label>Auth Base URL <input id="cfg-auth" type="text" placeholder="http://localhost:4000" /></label>
        <label>API Base URL <input id="cfg-api" type="text" placeholder="http://localhost:5001" /></label>
        <label>File Base URL <input id="cfg-file" type="text" placeholder="http://localhost:5000" /></label>
        <div class="actions" style="display:flex; gap:8px; justify-content:flex-end; margin-top:6px;">
          <button type="button" id="settings-cancel" class="btn outline">Cancel</button>
          <button type="submit" class="btn">Save</button>
        </div>
      </form>
    </div>
    <script type="module" src="./login.js"></script>
  </body>
</html>
