<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Upload Video</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Upload Video</h1>
      <div class="spacer"></div>
      <div id="auth-section">
        <button id="login-btn" class="btn">Login</button>
        <div id="user-info" class="hidden">
          <span id="username-label"></span>
          <button id="logout-btn" class="btn outline">Logout</button>
        </div>
      </div>
      <a class="btn outline" href="./index.html" style="text-decoration:none; margin-left:8px">Back to Videos</a>
      <button id="settings-btn" class="btn outline" style="margin-left:8px">Settings</button>
    </header>
    <main class="container">
      <form id="upload-form" class="card" style="padding:16px; display:grid; gap:12px;">
        <label>Title
          <input id="title" required />
        </label>
        <label>Description
          <input id="description" />
        </label>
        <label>Video file (MP4 preferred)
          <input id="file" type="file" accept="video/*" required />
        </label>
        <div id="preview" class="card" style="padding:8px; display:none">
          <video id="preview-video" class="player" controls></video>
        </div>
        <div class="actions" style="display:flex; gap:8px; align-items:center; justify-content:flex-end;">
          <span id="uploading-indicator" class="muted small hidden">Uploading…</span>
          <button type="button" id="cancel" class="btn outline">Cancel</button>
          <button type="submit" id="submit-btn" class="btn">Upload</button>
        </div>
        
      </form>
    </main>
  <!-- Toasts -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
    <!-- Login modal -->
    <div id="login-modal" class="modal hidden" role="dialog" aria-modal="true">
      <form id="login-form" class="modal-content card" autocomplete="on">
        <h2>Login</h2>
        <label>
          Username
          <input id="username" name="username" required />
        </label>
        <label>
          Password
          <input id="password" name="password" type="password" required />
        </label>
        <div class="actions">
          <button type="submit" class="btn">Login</button>
          <button type="button" id="cancel-login" class="btn outline">Cancel</button>
        </div>
  <p class="hint">Validated via Authentication Service. No account? <a href="./signup.html">Create one</a>.</p>
      </form>
    </div>

    <!-- Settings modal -->
    <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true">
      <form id="settings-form" class="modal-content card" autocomplete="on">
        <h2>Settings</h2>
        <label>
          Auth Base URL
          <input id="cfg-auth" type="text" placeholder="http://localhost:4000" />
        </label>
        <label>
          API Base URL
          <input id="cfg-api" type="text" placeholder="http://localhost:5000" />
        </label>
        <label>
          File Base URL
          <input id="cfg-file" type="text" placeholder="http://localhost:6000" />
        </label>
        <div class="actions">
          <button type="button" id="settings-cancel" class="btn outline">Cancel</button>
          <button type="submit" class="btn">Save</button>
        </div>
      </form>
    </div>
    <script type="module" src="./upload.js"></script>
  </body>
  </html>
